<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <script src="script.js"></script>

  <!-- * Tarea 2:  
   Tener la anchura variable que contenga todos los componentes y utilidades dentro de ella.  -->
  <div class="container-xl">

    <!-- * Tarea 3: 
     Botones y Color -->
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-warning">Warning</button>
    <button type="button" class="btn btn-info">Info</button>

    <!-- * Tarea 4: 
     Utilidades para alinear texto  -->
    <p class="text-start">Izquierda.</p>
    <p class="text-center">Centro.</p>
    <p class="text-end">Derecha.</p>




    <!-- * Tarea 5: 
     Añadir una tarjeta que tenga un grupo de listas -->
    <div class="card" style="width: 18rem;">
      <img
        src="https://png.pngtree.com/png-clipart/20240302/original/pngtree-a-basket-of-various-fruits-png-image_14475819.png"
        class="card-img-top" alt="...">
      <div class="card-body">
        <h5 class="card-title">Hoja de Ruta</h5>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s
          content.</p>
      </div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">Manzana</li>
        <li class="list-group-item">Naranja</li>
        <li class="list-group-item">Platano</li>
      </ul>
      <div class="card-body card-body--btn">
        <button type="button" class="btn btn-info">Info</button>
        <button type="button" class="btn btn-warning">Warning</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right"></script>

</body>

</html>
